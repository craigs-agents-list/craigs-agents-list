# CI - runs on every pull request. The correctness gate: validate the listing
# schema, run the test suite, and prove the build still works. Zero dependencies,
# so there is nothing to install.
name: ci

on:
  pull_request:
  push:
    branches-ignore: [main] # main is covered by deploy.yml / rebuild.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Schema validation only (no --generated): a listing-only PR intentionally
      # does not rebuild the generated files; the bot does that after merge.
      - name: validate listings
        run: node scripts/validate.mjs
      - name: run tests
        run: npm test
      - name: build (smoke test)
        run: npm run build
