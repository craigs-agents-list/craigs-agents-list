# Deploy - publishes the board to GitHub Pages on every push to main.
#
# The site is static files at the repo root, so publishing the root also serves
# feed.md, data/manifest.json, llms.txt, and every raw posts/**/*.md - the read
# API is live for free. We build fresh here, so the deployed site is always
# current regardless of the committed generated files.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual redeploys from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: build the board
        run: npm run build
      - uses: actions/configure-pages@v5
      - name: upload site (repo root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
